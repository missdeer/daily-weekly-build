name: cidr

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'
  push:
    paths:
      - '.github/scripts/generate_cidrs.py'
      - '.github/scripts/test_generate_cidrs.py'
      - '.github/workflows/cidr.yml'
  pull_request:
    paths:
      - '.github/scripts/generate_cidrs.py'
      - '.github/scripts/test_generate_cidrs.py'
      - '.github/workflows/cidr.yml'

concurrency:
  group: cidr-publish
  cancel-in-progress: false

jobs:
  route:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Test CIDR generator
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Download GeoLite2 country data
        env:
          MAXMIND_LICENSEKEY: ${{ secrets.MAXMIND_LICENSEKEY }}
        run: |
          set -euo pipefail
          curl --fail --show-error --location --retry 3 \
            "https://download.maxmind.com/app/geoip_download?edition_id=GeoLite2-Country-CSV&license_key=${MAXMIND_LICENSEKEY}&suffix=zip" \
            --output GeoLite2-Country-CSV.zip
          unzip -q GeoLite2-Country-CSV.zip

      - name: Generate CIDR files
        run: |
          set -euo pipefail
          data_dir=$(find . -maxdepth 1 -name 'GeoLite2-Country-CSV_*' -type d -print -quit)
          test -n "$data_dir"
          python3 .github/scripts/generate_cidrs.py \
            "$data_dir/GeoLite2-Country-Locations-zh-CN.csv" \
            "$data_dir/GeoLite2-Country-Blocks-IPv4.csv" \
            cidrs

      - name: Upload to GitHub repository
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        working-directory: cidrs
        run: |
          set -euo pipefail
          git init
          git add .
          git config user.name "update-cidrs[bot]"
          git config user.email "update-cidrs[bot]@users.noreply.github.com"
          git commit -m "update cidrs at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push --force --quiet \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:cidr
